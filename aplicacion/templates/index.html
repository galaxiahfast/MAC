<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Configuración técnica y administración de parámetros globales para la organización de dispositivos.">
    <title>Monitor de Red - @galaxiahfast</title>

    <!-- @galaxiahfast - Estilos principales. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/temas.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fondosPantallaPrincipal.css') }}" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notificaciones.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menuInferiorCentrado.css') }}">

    <!-- @galaxiahfast - Fuentes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <!-- @galaxiahfast - Preload de imágenes para optimizar la carga. -->
    <link rel="preload" href="{{ url_for('static', filename='imagenes/planoMovil.webp') }}" as="image" media="(max-width: 600px) and (resolution: 1dppx)">
    <link rel="preload" href="{{ url_for('static', filename='imagenes/planoMovil2x.webp') }}" as="image" media="(max-width: 600px) and (min-resolution: 2dppx)">
    <link rel="preload" href="{{ url_for('static', filename='imagenes/planoMediaResolucion.webp') }}" as="image" media="(min-width: 1201px)">
</head>

<!-- @galaxiahfast - El atributo data-theme se utiliza para controlar el tema de color a través de CSS. -->
<body data-theme="claro">





    <div class="contenedor-barra-herramientas-principal" role="complementary" aria-label="panel lateral">
        <div class="barra-herramientas-scroll">
            <div class="contenedor-interno-barra-herramientas">

                <button class="boton-menu-herramienta boton-menu-herramienta-navegacion" id="botonAlternarExpansionMenuLateralPrincipal" aria-label="menu" type="button">
                    <svg viewBox="3 0 18 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <div class="contenedor-separador-seccion-menu-lateral" data-seccion-menu="gestion-dispositivos"></div>

                <button class="boton-menu-herramienta boton-menu-herramienta-dispositivo" id="botonRegistrarNuevoDispositivoPlano" aria-label="dispositivo" type="button">
                    <svg viewBox="5 0 14 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-dispositivo" id="botonActivarModoEliminacionDispositivos" aria-label="eliminar" type="button">
                    <svg viewBox="3 0 18 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-dispositivo" id="botonActivarModoEdicionDispositivos" aria-label="editar" type="button">
                    <svg viewBox="2 0 20 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-dispositivo" id="botonActivarModoReubicacionDispositivos" aria-label="mover" type="button">
                    <svg viewBox="2 0 20 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="12" r="1"></circle>
                        <circle cx="15" cy="12" r="1"></circle>
                        <circle cx="12" cy="9" r="1"></circle>
                        <circle cx="12" cy="15" r="1"></circle>
                        <polyline points="5 9 2 12 5 15"></polyline>
                        <polyline points="9 5 12 2 15 5"></polyline>
                        <polyline points="15 19 12 22 9 19"></polyline>
                        <polyline points="19 9 22 12 19 15"></polyline>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-dispositivo" id="botonAlternarVisibilidadDispositivosRenderizados" aria-label="ver" type="button">
                    <svg viewBox="1 0 22 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="12" x2="23" y2="23"></line>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-apartado" id="botonRegistrarNuevoApartadoGlobalDispositivos" aria-label="apartado" type="button">
                    <svg viewBox="3 0 18 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-apartado" id="botonEliminarApartadosExistentesDispositivos" aria-label="quitar" type="button">
                    <svg viewBox="3 0 18 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-papelera" id="botonAbrirPanelRestauracionElementosEliminados" aria-label="papelera" type="button">
                    <svg viewBox="3 0 18 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>

                <div class="contenedor-separador-seccion-menu-lateral" data-seccion-menu="preferencias-visuales"></div>

                <button class="boton-menu-herramienta boton-menu-herramienta-tema" id="botonAlternarTemaVisualAplicacion" aria-label="tema" type="button">
                    <svg viewBox="2 0 20 24" fill="none" stroke="currentColor">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <div class="contenedor-separador-seccion-menu-lateral" data-seccion-menu="configuracion-general"></div>

                <button class="boton-menu-herramienta boton-menu-herramienta-configuracion" id="botonAbrirConfiguracionGeneralSistema" aria-label="config" type="button">
                    <svg viewBox="1 0 22 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-sesion" id="botonCerrarSesionUsuarioActualSistema" aria-label="salir" type="button">
                    <svg viewBox="3 0 18 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>

                <button class="boton-menu-herramienta boton-menu-herramienta-usuario" id="botonAbrirPerfilUsuarioAutenticadoSistema" aria-label="perfil" type="button">
                    <svg viewBox="4 0 16 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    




    <!-- @galaxiahfast - Contenedor principal con scroll para toda la aplicación. -->
    <div class="contenedor-principal-aplicacion">

        <!-- @galaxiahfast - Contenedor principal del mapa interactivo. -->
        <main id="contenidoPrincipal">

            <!-- @galaxiahfast - Contenedor del plano técnico con capas superpuestas. -->
            <div class="map-container" id="contenedorMapa">
                
                <!-- ✅ NUEVO: Contenedor interno para centrar la imagen -->
                <div class="contenedor-imagen-centrada">
                    <!-- @galaxiahfast - Imagen del plano base con srcset responsive. -->
                    <img src="{{ url_for('static', filename='imagenes/planoMovil.webp') }}"
                        srcset="
                            {{ url_for('static', filename='imagenes/planoMovil.webp') }} 412w,
                            {{ url_for('static', filename='imagenes/planoMovil2x.webp') }} 824w,
                            {{ url_for('static', filename='imagenes/planoBajaResolucion.webp') }} 750w,
                            {{ url_for('static', filename='imagenes/planoMediaResolucion.webp') }} 1200w,
                            {{ url_for('static', filename='imagenes/planoAltaResolucion.webp') }} 2294w
                        "
                        sizes="
                            (max-width: 600px) 100vw,
                            (max-width: 1200px) 800px,
                            2294px
                        "
                        width="2294"
                        height="2722"
                        fetchpriority="high"
                        class="plano-base"
                        alt="Plano técnico de distribución de dispositivos"
                    >
                </div>
                
                <!-- @galaxiahfast - Capa de cuadrícula superpuesta al plano (solo visual). -->
                <div class="grid-overlay"></div>
                
                <!-- @galaxiahfast - Capa dinámica donde se renderizan los dispositivos/puntos. -->
                <div id="capaDispositivos"></div>
            </div>
        </main>

    </div>

    <!-- @galaxiahfast - Scripts para control de temas, sistema de notificaciones y lógica principal. -->
    <script src="{{ url_for('static', filename='js/otros/controlTemas.js') }}"></script>
    <script src="{{ url_for('static', filename='js/otros/sistemaNotificaciones.js') }}"></script>
    <script src="{{ url_for('static', filename='js/otros/comportamientoMenuPrincipal.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
