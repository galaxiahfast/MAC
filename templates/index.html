<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Dispositivos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="map-container" id="map">
    <img src="{{ url_for('static', filename='plano.png') }}" class="plano-img">
    
    {% for info in devices %}
    {% set clean_id = info.mac.replace(':', '') %}
    <div class="marker-wrapper" id="dev-{{ clean_id }}" 
         style="top: {{ info.pos_y }}; left: {{ info.pos_x }};"
         onmousedown="startDrag(event, '{{ info.mac }}')">
        
        <div class="punto" style="background: {{ '#4ade80' if info.status == 'online' else '#f87171' }}; 
             box-shadow: 0 0 15px {{ '#4ade80' if info.status == 'online' else '#f87171' }};"></div>
        
        <div class="info-box">
            <div class="status-row">
                <div class="header-left">
                    <span class="label-header edit-field" contenteditable="true" 
                          onblur="updateField('{{ info.mac }}', 'name', this.innerText)">{{ info.name }}</span>
                    <button onclick="copyToClipboard('{{ info.mac }}', this)" class="action-btn">📋</button>
                </div>
                <span class="online-status" style="color: {{ '#4ade80' if info.status == 'online' else '#f87171' }}">● {{ info.status|upper }}</span>
            </div>
            
            <div class="scroll-content">
                <div class="label">USUARIO</div>
                <div class="data edit-field" contenteditable="true" onblur="updateField('{{ info.mac }}', 'usuario', this.innerText)">{{ info.get('usuario', 'Desconocido') }}</div>

                <div class="label">KASPERSKY</div>
                <div class="sw-row">
                    <span class="countdown" data-expiry="{{ info.get('kaspersky_expiry', generic_expiry) }}"></span>
                </div>

                <div class="label">DIRECCIÓN IP</div>
                <div class="data">{{ info.ip }}</div>
                
                <div class="label">DIRECCIÓN MAC</div>
                <div class="data">{{ info.mac }}</div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
